name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - typo3-version: '^13.4'
            php-version: '8.3'
            name: 'TYPO3 13 / PHP 8.3'
          - typo3-version: '^14.0'
            php-version: '8.3'
            name: 'TYPO3 14 / PHP 8.3'
          - typo3-version: '^14.0'
            php-version: '8.4'
            name: 'TYPO3 14 / PHP 8.4'

    name: ${{ matrix.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer require --no-interaction --no-update \
            "typo3/cms-core:${{ matrix.typo3-version }}" \
            "typo3/cms-backend:${{ matrix.typo3-version }}" \
            "typo3/cms-workspaces:${{ matrix.typo3-version }}" \
            "typo3/cms-install:${{ matrix.typo3-version }}"
          composer update --no-interaction --prefer-dist

      - name: Run functional test suite
        run: composer test
